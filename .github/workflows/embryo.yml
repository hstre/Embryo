name: Grow embryo

on:
  push:
    branches:
      - main
    paths:
      - .embryo/start
  workflow_dispatch:
    inputs:
      backend:
        description: Cell policy
        required: true
        type: choice
        default: smollm
        options:
          - smollm
          - deterministic
      max_cells:
        description: Maximum cells in this generation
        required: true
        default: "4"
      auto_grow:
        description: Trigger another generation while validated needs remain
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: embryo-growth
  cancel-in-progress: false

jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      CELL_MODEL: HuggingFaceTB/SmolLM2-135M-Instruct
      CELL_MODEL_REVISION: 12fd25f77366fa6b3b4b768ec3050bf629380bac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check out persistent tissue
        shell: bash
        run: |
          git config user.name "embryo-cell"
          git config user.email "embryo-cell@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin embryo-state >/dev/null 2>&1; then
            git fetch origin embryo-state
            git checkout -B embryo-state origin/embryo-state
            git merge --no-edit "${GITHUB_SHA}"
          else
            git checkout -b embryo-state
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.HF_HOME }}
          key: smollm2-135m-${{ env.CELL_MODEL_REVISION }}

      - run: npm ci
      - run: npm test
      - run: npm run validate

      - name: Run one bounded generation
        env:
          BACKEND: ${{ inputs.backend || 'smollm' }}
          MAX_CELLS: ${{ inputs.max_cells || '4' }}
        run: >-
          npm run step --
          --backend "$BACKEND"
          --max-cells "$MAX_CELLS"
          --model "$CELL_MODEL"
          --revision "$CELL_MODEL_REVISION"
          --dtype q4

      - run: npm run validate
      - run: npm run replay

      - name: Persist tissue
        run: |
          git config user.name "embryo-cell"
          git config user.email "embryo-cell@users.noreply.github.com"
          git add state/embryo.json state/events.jsonl
          if ! git diff --cached --quiet; then
            generation=$(node -e "console.log(JSON.parse(require('fs').readFileSync('state/embryo.json')).generation)")
            git commit -m "grow: generation ${generation}"
            git push origin HEAD:embryo-state
          fi

      - name: Read growth signal
        id: growth
        run: echo "can_grow=$(node src/cli.mjs can-grow)" >> "$GITHUB_OUTPUT"

      - name: Recruit next generation
        if: (inputs.auto_grow || github.event_name == 'push') && steps.growth.outputs.can_grow == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND: ${{ inputs.backend || 'smollm' }}
          MAX_CELLS: ${{ inputs.max_cells || '4' }}
        run: >-
          gh workflow run embryo.yml
          --ref main
          -f backend="$BACKEND"
          -f max_cells="$MAX_CELLS"
          -f auto_grow=true

      - name: Summary
        run: npm run status >> "$GITHUB_STEP_SUMMARY"
